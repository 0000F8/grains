[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grains-sdk"
version = "0.2.0"
description = "The Python framework for building Grains agents (hosted AI agents with a signed identity that can charge per call)."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Grains" }]
keywords = ["ai", "agents", "llm", "claude", "mcp", "x402", "hosting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
crypto = ["ecdsa>=0.18", "pycryptodome>=3.19"]

[project.urls]
Homepage = "https://grains.run"
Documentation = "https://grains.run/docs.html"
Repository = "https://github.com/0000F8/grains"

[tool.setuptools.packages.find]
include = ["grains*"]
